<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Prince Online Canteen</title>
<link rel="icon" href="img/prince_online_canteen_youtube_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --turmeric: #e3a021;
  --turmeric-dark: #b97c12;
  --chili: #c8401f;
  --leaf: #2f5233;
  --leaf-dark: #203823;
  --leaf-light: #6f8f6a;
  --cream: #faf3e3;
  --cream-2: #f2e6cb;
  --ink: #26221b;
  --paper: #fffdf8;
  --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --radius: 18px;
  --shadow-card: 0 8px 24px rgba(47, 82, 51, 0.14);
  --shadow-soft: 0 2px 10px rgba(38, 34, 27, 0.08);
  --container: 1180px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
.site-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--leaf);
  color: var(--paper);
  box-shadow: var(--shadow-soft);
}
.site-nav .wrap {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 40px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: clamp(1.05rem, 2.4vw, 1.4rem);
  color: var(--paper);
}
.brand img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--turmeric);
  object-fit: cover;
  background: var(--paper);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-links a {
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.95rem;
  font-weight: 600;
  transition: background 0.2s ease;
}
.nav-links a:hover { background: rgba(255,255,255,0.1); }
.nav-links a.cta {
  background: var(--turmeric);
  color: var(--ink);
}
.form-page {
  padding: clamp(36px, 7vw, 70px) 0 clamp(60px, 8vw, 100px);
}
.form-card {
  max-width: 500px;
  margin: 0 auto;
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: clamp(24px, 5vw, 44px);
}
.form-card h1 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.6vw, 2rem);
  color: var(--leaf-dark);
  margin-bottom: 6px;
}
.form-card > p.sub {
  color: #5a5748;
  margin-bottom: 26px;
  font-size: 0.95rem;
}
.field {
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--leaf-dark);
}
.field input, .field select {
  width: 100%;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1.5px solid #dcd3ba;
  background: var(--cream);
  font-family: var(--font-body);
  font-size: 0.98rem;
  color: var(--ink);
}
.field input:focus, .field select:focus {
  border-color: var(--turmeric);
  background: var(--paper);
  outline: none;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.98rem;
  border: none;
  cursor: pointer;
  width: 100%;
  background: var(--turmeric);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(227,160,33,0.35);
  transition: background 0.2s ease;
}
.btn:hover { background: var(--turmeric-dark); }
.small-note {
  font-size: 0.85rem;
  color: #7a7869;
  text-align: center;
  margin-top: 16px;
}
.small-note a { color: var(--leaf); font-weight: 600; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="POC.index.html" class="brand">
      <img src="img/prince_online_canteen_youtube_logo.png" alt="">
      Prince Online Canteen
    </a>
    <div class="nav-links">
      <a href="POC.index.html">HOME</a>
      <a href="account.html"><i class="fa-solid fa-user"></i> ACCOUNT</a>
      <a href="register.html"><i class="fa-solid fa-user-plus"></i> REGISTER</a>
    </div>
  </div>
</nav>

<main class="form-page">
  <div class="wrap">
    <div class="form-card">
      <h1>Create Account</h1>
      <p class="sub">Register your profile for faster checkout and ordering.</p>
      <form onsubmit="event.preventDefault(); alert('Registration successful!');">
        <div class="field">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="field">
          <label for="reg-email">Email / Username</label>
          <input type="text" id="reg-email" placeholder="Choose a username or email" required>
        </div>
        <div class="field">
          <label for="role">I am a</label>
          <select id="role" required>
            <option value="">Select role</option>
            <option value="Student">Student</option>
            <option value="Teacher">Teacher</option>
            <option value="Staff">Staff Member</option>
          </select>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn"><i class="fa-solid fa-user-plus"></i> Register Account</button>
      </form>
      <p class="small-note">Already have an account? <a href="account.html">Login here</a></p>
    </div>
  </div>
</main>

</body>
</html>
