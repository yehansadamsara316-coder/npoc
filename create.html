<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Prince Online Canteen</title>
<link rel="icon" href="img/prince_online_canteen_youtube_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #d97706;
  --primary-hover: #b45309;
  --primary-light: #fef3c7;
  --leaf-dark: #1b3822;
  --leaf-mid: #2d5a37;
  --bg-gradient: linear-gradient(135deg, #1b3822 0%, #2d5a37 50%, #0f2314 100%);
  --paper: #ffffff;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --border-color: #e5e7eb;
  --radius-lg: 24px;
  --radius-md: 14px;
  --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.25);
  --font-display: 'Baloo 2', cursive;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg-gradient);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--text-main);
  position: relative;
  overflow-x: hidden;
}

/* Background Glowing Bubbles */
body::before, body::after {
  content: '';
  position: absolute;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(90px);
  z-index: 0;
  opacity: 0.4;
  pointer-events: none;
}
body::before {
  background: var(--primary);
  top: -50px;
  left: -50px;
}
body::after {
  background: #22c55e;
  bottom: -50px;
  right: -50px;
}

/* Navbar */
.site-nav {
  position: relative;
  z-index: 10;
  background: rgba(27, 56, 34, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.site-nav .wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 76px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  letter-spacing: 0.3px;
}
.brand img {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2.5px solid var(--primary);
  object-fit: cover;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-links a {
  color: rgba(255, 255, 255, 0.85);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-links a:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
}
.nav-links a.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
}

/* Page Layout */
.form-page {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.form-card {
  width: 100%;
  max-width: 480px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-premium);
  padding: 40px 36px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-header {
  text-align: center;
  margin-bottom: 30px;
}
.card-header .icon-badge {
  width: 60px;
  height: 60px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  margin-bottom: 14px;
  box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.2);
}
.card-header h1 {
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--leaf-dark);
  line-height: 1.2;
}
.card-header p {
  color: var(--text-muted);
  font-size: 0.92rem;
  margin-top: 6px;
}

/* Input Fields */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.field label {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--leaf-dark);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.input-wrapper i.input-icon {
  position: absolute;
  left: 16px;
  color: #9ca3af;
  font-size: 1.05rem;
  transition: color 0.2s ease;
  pointer-events: none;
}
.input-wrapper input, 
.input-wrapper select {
  width: 100%;
  padding: 14px 16px 14px 46px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-color);
  background: #f9fafb;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text-main);
  transition: all 0.25s ease;
  appearance: none;
}
.input-wrapper select {
  cursor: pointer;
}
.input-wrapper .select-arrow {
  position: absolute;
  right: 16px;
  color: #9ca3af;
  pointer-events: none;
  font-size: 0.85rem;
}

.input-wrapper input:focus, 
.input-wrapper select:focus {
  outline: none;
  border-color: var(--primary);
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
}
.input-wrapper input:focus ~ i.input-icon,
.input-wrapper select:focus ~ i.input-icon {
  color: var(--primary);
}

/* Submit Button */
.btn-submit {
  margin-top: 10px;
  width: 100%;
  padding: 15px;
  border-radius: var(--radius-md);
  border: none;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
  color: #ffffff;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
  transition: all 0.3s ease;
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(217, 119, 6, 0.45);
}
.btn-submit:active {
  transform: translateY(0);
}

/* Footer note */
.card-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 0.9rem;
  color: var(--text-muted);
}
.card-footer a {
  color: var(--primary);
  font-weight: 700;
  text-decoration: none;
  transition: color 0.2s;
}
.card-footer a:hover {
  text-decoration: underline;
  color: var(--primary-hover);
}

@media (max-width: 480px) {
  .form-card { padding: 28px 20px; }
  .site-nav .wrap { padding: 0 16px; }
  .nav-links a span { display: none; }
}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="POC.index.html" class="brand">
      <img src="/img/prince_online_canteen_youtube_logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/44?text=POC'">
      <span>Prince Canteen</span>
    </a>
    <div class="nav-links">
      <a href="POC.index.html"><i class="fa-solid fa-house"></i> <span>Home</span></a>
      <a href="account.html"><i class="fa-solid fa-user"></i> <span>Account</span></a>
      <a href="register.html" class="active"><i class="fa-solid fa-user-plus"></i> <span>admin</span></a>
    </div>
  </div>
</nav>

<main class="form-page">
  <div class="form-card">
    <div class="card-header">
      <div class="icon-badge">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h1>Create Account</h1>
      <p>Register profile for fast canteen pre-orders</p>
    </div>

    <form id="registerForm">
      <div class="field-group">
        <div class="field">
          <label for="fullname">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="fullname" placeholder="e.g. Nimal Perera" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-email">Email / Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="text" id="reg-email" placeholder="e.g. nimal@prince.lk" required>
          </div>
        </div>

        <div class="field">
          <label for="role">User Role</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-badge input-icon"></i>
            <select id="role" required>
              <option value="" disabled selected>Select your role</option>
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Staff">Staff Member</option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow"></i>
          </div>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" placeholder="Create a strong password" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Register Account</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </form>

    <div class="card-footer">
      Already registered? <a href="account.html">Login to account</a>
    </div>
  </div>
</main>

<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fullName = document.getElementById('fullname').value;
    const email = document.getElementById('reg-email').value;
    const role = document.getElementById('role').value;
    const password = document.getElementById('reg-password').value;

    const newUser = {
      id: Date.now(),
      fullName: fullName,
      email: email,
      role: role,
      password: password,
      date: new Date().toLocaleDateString()
    };

    // Store in Pending Approvals array in LocalStorage
    let pendingUsers = JSON.parse(localStorage.getItem('pendingAdminApprovals')) || [];
    let approvedUsers = JSON.parse(localStorage.getItem('approvedAccounts')) || [];
    
    // Check duplication
    const isPending = pendingUsers.some(u => u.email === email);
    const isApproved = approvedUsers.some(u => u.email === email);

    if (isPending || isApproved) {
      alert('This Email/Username is already registered!');
      return;
    }

    pendingUsers.push(newUser);
    localStorage.setItem('pendingAdminApprovals', JSON.stringify(pendingUsers));

    alert('Registration submitted successfully! Awaiting Admin Approval.');
    this.reset();
  });
</script>

</body>
</html>
