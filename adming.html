    <script>

        // Fetch All Orders Function
        async function fetchOrders() {
            const tbody = document.getElementById('all-orders-body');
            
            const { data, error } = await _supabase
                .from('canteen_orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching orders:", error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error loading orders: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center">කිසිදු Order එකක් හමුවූයේ නැත.</td></tr>`;
                updateAnalytics([]);
                return;
            }

            // Render Orders to Table
            let html = '';
            data.forEach(order => {
                const statusBadge = order.status === 'Completed' 
                    ? `<span class="badge-completed">Completed</span>`
                    : `<span class="badge-pending">Pending</span>`;

                html += `
                    <tr>
                        <td><b>${order.time || 'N/A'}</b></td>
                        <td>${order.name || '-'}</td>

        // Analytics Update Function
        function updateAnalytics(orders) {
            document.getElementById('total-orders-count').innerText = orders.length;

            const pendingCount = orders.filter(o => o.status === 'Pending').length;
            document.getElementById('pending-orders-count').innerText = pendingCount;

            let totalIncome = 0;
            orders.forEach(o => {
                if (o.totalCash) {
                    const priceNum = parseFloat(o.totalCash.replace(/[^0-9.]/g, '')) || 0;
                    totalIncome += priceNum;
                }
            });
            document.getElementById('total-income').innerText = 'LKR ' + totalIncome.toFixed(2);
        }

        const { data, error } = await _supabase
            .from('canteen_orders')

        // 2. Customer ට VIWA SMS එක යැවීම

        alert("දෝෂයක් සිදු විය: " + err.message);
    }
}

// VIWA SMS API එක Call කරන Function එක
async function sendViwaSMS(phone, name) {
    // VIWA SMS API credentials (ඔබගේ VIWA Dashboard එකෙන් ලැබෙන විස්තර ඇතුළත් කරන්න)
    const apiKey = "YOUR_VIWA_API_KEY"; // ඔබේ API Key එක
    const senderId = "YOUR_SENDER_ID"; // ඔබේ Sender ID (උදා: CANTEEN)
    
    // Phone number එකේ මුලට 94 එකතු කිරීම (ලංකාවේ 07XXXXXXXX අංක සඳහා)
    let formattedPhone = phone.trim();
    if (formattedPhone.startsWith("0")) {
        formattedPhone = "94" + formattedPhone.substring(1);
    }

    // Customer ට යන SMS පණිවිඩය
    const message = `Hi ${name || 'Customer'}, Oba ge Canteen Order eka dan Ready! Karunakara Canteen eken laba ganna. Stuthii!`;

    // VIWA SMS API Endpoint (HTTP API)
    const viwaUrl = `https://mysms.viwa.lk/api/v3/sms/send`; 

    try {
        const response = await fetch(viwaUrl, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                recipient: formattedPhone,
                sender_id: senderId,
                message: message
            })
        });

        const resData = await response.json();
        console.log("SMS Response:", resData);
    } catch (smsError) {
        console.error("SMS Sending Failed:", smsError);
        // SMS එක නොගියත් Database status වෙනස් වී ඇති නිසා User ට alert එකක් පෙන්වනු ඇත
    }
}

async function markCompleted(orderId, customerPhone, customerName, customerEmail, totalCash) {
    if (!confirm("මෙම Order එක Completed ලෙස Mark කිරීමට සහ Customer ට Email එකක් යැවීමට අවශ්‍යද?")) {
        return;
    }

    try {
        // 1. Supabase Database එකෙහි Status එක Completed කිරීම
        const { data, error } = await _supabase
            .from('canteen_orders')
            .update({ status: 'Completed' })
            .eq('id', orderId);

        if (error) {
            alert("Status වෙනස් කිරීමට නොහැකි විය: " + error.message);
            return;

        if (customerEmail && customerEmail !== 'undefined' && customerEmail !== '') {

        fetchOrders(); // Admin Table එක Refresh කිරීම

        alert("දෝෂයක් සිදු විය: " + err.message);
    }
}

// EmailJS හරහා Automatic Email යැවීම
function sendEmailNotification(name, email, orderId, totalCash) {
    const serviceID = "service_diqiuh2";   // EmailJS Service ID එක
    const templateID = "template_ha9652i"; // EmailJS Template ID එක

    const templateParams = {
        to_name: name || 'Customer',
        to_email: email,
        order_id: orderId,
        total_cash: totalCash
    };

    emailjs.send(serviceID, templateID, templateParams)
        .then(function(response) {
            console.log('EMAIL SUCCESS!', response.status, response.text);
        }, function(error) {
            console.error('EMAIL FAILED...', error);
        });
}
