<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — Prince Online Canteen</title>
    <link rel="icon" href="prince_online_canteen_youtube_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2f5233">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="POC Canteen">
    <link rel="apple-touch-icon" href="prince_online_canteen_youtube_logo.png">
    <style>
        :root {
          --turmeric: #e3a021;
          --leaf: #2f5233;
          --leaf-dark: #203823;
          --cream: #faf3e3;
          --ink: #26221b;
          --paper: #fffdf8;
          --radius: 18px;
          --shadow-card: 0 8px 24px rgba(47, 82, 51, 0.14);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
        a { color: inherit; text-decoration: none; }
        
        .site-nav {
          background: var(--leaf); color: var(--paper); padding: 0 40px; height: 72px;
          display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-family: "Baloo 2", sans-serif; font-size: 1.2rem; }
        .brand img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--turmeric); object-fit: cover; background: var(--paper); }

        .auth-container { max-width: 420px; margin: 60px auto; background: var(--paper); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow-card); text-align: center; }
        .auth-container h1 { font-family: "Baloo 2", sans-serif; color: var(--leaf-dark); margin-bottom: 8px; }
        .auth-subtitle { font-size: 0.9rem; color: #665c49; margin-bottom: 24px; }
        
        .field { margin-bottom: 20px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 0.85rem; font-weight: 600; color: var(--leaf-dark); }
        .field input { width: 100%; padding: 14px; border-radius: 10px; border: 1.5px solid #dcd3ba; background: var(--cream); font-size: 1rem; text-align: center; letter-spacing: 2px; }
        
        .btn-submit { width: 100%; padding: 14px; background: var(--turmeric); border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: background 0.2s; display: inline-block; text-align: center; }
        .btn-submit:hover { background: #cca021; }
        
        .error-msg { color: #d93838; font-size: 0.85rem; margin-top: 10px; display: none; }
        
        /* Lock Screen Styling */
        .locked-box { display: none; background: #ffebeb; border: 1px solid #f5c2c2; padding: 20px; border-radius: 12px; margin-top: 15px; }
        .locked-box p { color: #b71c1c; font-weight: 600; margin-bottom: 12px; font-size: 0.9rem; }
        .btn-wa { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: #25D366; color: white; border-radius: 10px; font-weight: 700; text-decoration: none; }
        .btn-wa:hover { background: #1ebc57; }
    </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand">
    <img src="prince_online_canteen_youtube_logo.png" alt="Logo">
    Prince Online Canteen
  </a>
  <a href="index.html" style="font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Home</a>
</nav>

<div class="auth-container">
    <h1>Admin Access</h1>
    <p class="auth-subtitle">Enter your single admin password to proceed</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
            <label>Admin Passcode</label>
            <input type="password" id="adminPass" required minlength="6" maxlength="10" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Login to Dashboard</button>
        <div id="errorMsg" class="error-msg"></div>
    </form>

    <!-- Locked Warning Block -->
    <div id="lockedBox" class="locked-box">
        <p><i class="fa-solid fa-lock"></i> Account Locked! You entered the wrong password 3 times.</p>
        <a id="waLink" href="#" target="_blank" class="btn-wa">
            <i class="fa-brands fa-whatsapp"></i> Request Admin Approval
        </a>
    </div>
</div>

<script>
    const MAX_ATTEMPTS = 3;
    const ADMIN_PHONE = "94783421064"; // මෙතැනට Admin ගේ WhatsApp අංකය ඇතුළත් කරන්න (Country code සමඟ - e.g. 94771234567)

    function checkLockStatus() {
        let attempts = parseInt(localStorage.getItem('adminAttempts') || '0');
        if (attempts >= MAX_ATTEMPTS) {
            lockAccount();
        }
    }

    function lockAccount() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('lockedBox').style.display = 'block';
        
        // WhatsApp Message එක හදාගැනීම
        const msg = encodeURIComponent("Hello Admin, My Admin Access Portal has been locked due to 3 incorrect password attempts. Please unlock my access.");
        document.getElementById('waLink').href = `https://wa.me/$0783421064?text=${unlockedMsg}`;
    }

    function handleLogin(e) {
        e.preventDefault();
        
        let attempts = parseInt(localStorage.getItem('adminAttempts') || '0');
        
        if (attempts >= MAX_ATTEMPTS) {
            lockAccount();
            return;
        }

        const pass = document.getElementById('adminPass').value;
        const errorText = document.getElementById('errorMsg');
        
        // Correct Password
        if (pass === "admin123") {
            localStorage.setItem('adminAttempts', '0'); // Reset attempts on success
            window.location.href = "admin methord.html";
        } else {
            attempts++;
            localStorage.setItem('adminAttempts', attempts);
            
            if (attempts >= MAX_ATTEMPTS) {
                lockAccount();
            } else {
                const remaining = MAX_ATTEMPTS - attempts;
                errorText.style.display = "block";
                errorText.innerText = `Incorrect password! Remaining attempts: ${remaining}`;
            }
        }
    }
    

    // Page එක Load වන විට Lock වී තිබේදැයි පරීක්ෂා කිරීම
    window.onload = checkLockStatus;
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker Registered Successfully:', reg.scope))
        .catch((err) => console.log('Service Worker Registration Failed:', err));
    });
  }
</script>

</body>
</html>
